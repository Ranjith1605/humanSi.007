name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # Standard library only: there is no go.sum to key a cache on.
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scoring and level checks
        run: node --test web/js/scoring.test.mjs web/js/game/levels.test.mjs web/js/glassbox/glassbox.test.mjs

      - name: Every local asset, link and import resolves
        run: node scripts/check-assets.mjs
