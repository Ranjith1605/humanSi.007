name: Rule Book suggestion
description: Propose a change to the Charter, the Six Gates or a gate scenario
labels: [rulebook]
body:
  - type: markdown
    attributes:
      value: The Rule Book text is not under an open licence (see NOTICE.md); the author decides on every change.
  - type: input
    id: part
    attributes:
      label: Which part?
      placeholder: e.g. G4 question, article X2, the triage-belt scenarios
  - type: textarea
    id: change
    attributes:
      label: The suggested change and why
    validations:
      required: true
