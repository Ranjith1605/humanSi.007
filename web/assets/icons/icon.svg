<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The HumanSI mark: a cyan visor (the human looking in) inside a violet
       ring (the oversight that holds the system). Drawn with attributes only,
       no style element, so it renders the same under the site's strict CSP.
       Strokes are thick on purpose: the mark must still read at 48 px.
       scripts/build-icons.mjs renders the PNGs from this file. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="44%" r="52%">
      <stop offset="0" stop-color="#18223f"/>
      <stop offset="1" stop-color="#04050b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#66e1ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#66e1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#04050b"/>
  <circle cx="256" cy="256" r="154" fill="url(#core)"/>
  <ellipse cx="256" cy="248" rx="140" ry="64" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#c58bff" stroke-width="44"/>
  <path d="M146 236A300 300 0 0 0 366 236" fill="none" stroke="#66e1ff" stroke-width="56" stroke-linecap="round"/>
  <path d="M177 232A286 286 0 0 0 216 240" fill="none" stroke="#e2faff" stroke-width="12" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
